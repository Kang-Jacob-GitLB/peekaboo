name: build

# PR 게이트: main 룰셋의 필수 상태 검사(아래 job 의 name)가 이 결과를 본다.
# job name 을 바꾸면 룰셋의 required_status_checks context 도 함께 바꿀 것.
on:
  # main 푸시는 Rust 캐시를 main 범위에 저장해 PR 들이 읽게 하려는 것이다(PR 캐시는 다른 PR 이 못 읽는다)
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck · Build
    # 헬퍼가 net8.0-windows(CsWin32)라 Windows 러너에서 빌드한다
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # README 는 300줄 이내(CLAUDE.md). 넘치면 세부 내용을 docs/ 로 옮긴다.
      - name: README 길이 점검
        run: |
          lines=$(wc -l < README.md)
          echo "README.md: ${lines}줄"
          if [ "$lines" -gt 300 ]; then
            echo "::error file=README.md::README.md 가 ${lines}줄입니다. 300줄 이내로 줄이고 세부 내용은 docs/ 로 옮기세요."
            exit 1
          fi

      - name: Node 설정
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: .NET 설정
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"

      # 타입 검사·번들만 하므로 Electron 바이너리는 받지 않는다
      - name: 의존성 설치
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci

      - name: 타입 검사
        run: npm run typecheck

      # 렌더러의 파일 해석(zip·tar·텍스트)을 예전 Node 구현의 출력과 비교한다(test/fixtures/expected)
      - name: 테스트
        run: npm test

      - name: 빌드 (electron-vite)
        run: npm run build

      # Tauri 앱(src-tauri). generate_context! 가 frontendDist(out/renderer-tauri)를 요구해 cargo 단계보다 먼저 빌드한다.
      - name: 렌더러 빌드 (Tauri)
        run: npm run build:web:tauri

      - name: Rust 툴체인 설정
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          # 툴체인을 고정한다(새 stable 의 clippy 규칙 추가로 PR 과 무관하게 CI 가 깨지는 것을 막는다). 올릴 때는 이 값만 바꾼다.
          toolchain: 1.100.0
          components: rustfmt, clippy

      - name: Rust 캐시
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Rust 서식 점검
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust 린트 (clippy)
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Rust 테스트
        working-directory: src-tauri
        run: cargo test --locked

      - name: 헬퍼 빌드 (트리밍 경고까지 확인)
        run: npm run helper:build

      # 얕은 체크아웃이라 태그가 없어 실제 계산은 nightly-release 에서 한다. 여기서는 문법만 본다.
      - name: 다음 버전 계산 스크립트 문법 점검
        run: node --check scripts/next-version.mjs
