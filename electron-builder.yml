appId: io.github.kang-jacob-gitlb.peekaboo
productName: Peekaboo
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
extraResources:
  - from: helper/publish/peekaboo-helper.exe
    to: helper/peekaboo-helper.exe
  - from: resources/tray.png
    to: tray.png
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
publish: null
