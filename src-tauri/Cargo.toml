[package]
name = "peekaboo"
version = "0.0.0"
edition = "2021"
description = "Windows 탐색기에서 Space 로 미리보기를 띄우는 상주 앱 (Tauri 2)"
license = "GPL-3.0-only"
publish = false

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# cargo build 만으로 frontendDist 를 바이너리에 싣는다(tauri build 가 켜 주는 feature 와 동일)
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# 아래 두 크레이트는 tauri 2.12.5 가 쓰는 wry 0.57.2 와 같은 버전(webview2-com 0.39, windows 0.62)이어야
# with_webview 가 돌려주는 COM 인터페이스 타입이 맞는다.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_UI_Shell",
]
