[package]
name = "peekaboo"
version = "0.0.0"
edition = "2021"
description = "Windows 탐색기에서 Space 로 미리보기를 띄우는 상주 앱 (Tauri 2)"
license = "GPL-3.0-only"
publish = false

[dependencies]
# tray-icon: 트레이, image-png: resources/tray.png 를 Image 로 읽는다
tauri = { version = "2", features = ["tray-icon", "image-png"] }
# 단일 인스턴스. 디버그 단독 미리보기를 뺀 모든 실행에서 Builder 에 맨 먼저 등록한다.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order: settings.json 의 키 순서를 Electron(JS 객체)처럼 읽은 순서대로 유지한다
serde_json = { version = "1", features = ["preserve_order"] }
# 헬퍼 프로세스 감시(tokio::process). 런타임은 tauri::async_runtime 이 이미 돌리고 있는 것을 쓴다.
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "rt", "macros"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# 멈춘 시계로 ping 타이머를 시험한다(tokio::time::advance)
tokio = { version = "1", features = ["test-util"] }

[features]
# cargo build 만으로 frontendDist 를 바이너리에 싣는다(tauri build 가 켜 주는 feature 와 동일)
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# 아래 두 크레이트는 tauri 2.12.5 가 쓰는 wry 0.57.2 와 같은 버전(webview2-com 0.39, windows 0.62)이어야
# with_webview 가 돌려주는 COM 인터페이스 타입이 맞는다.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Registry",
  "Win32_UI_Shell",
]
