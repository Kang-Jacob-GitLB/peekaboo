<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>Peekaboo Spike</title>
  <style>
    html, body { margin: 0; height: 100%; font-family: "Segoe UI", sans-serif; background: #202124; color: #e8eaed; }
    header { height: 36px; line-height: 36px; padding: 0 12px; background: #35363a; font-weight: 600; }
    main { padding: 16px; }
    p { margin: 0 0 8px; }
    select, button { margin: 8px 8px 0 0; padding: 4px 8px; }
    /* native 모드 전용(native.js 가 body.native 를 붙인다): 헬퍼 컨테이너 아래에서 계속 다시 그려지는 요소 */
    #anim-header, #anim-body { display: none; }
    body.native #anim-header { display: block; position: absolute; top: 4px; right: 12px; width: 28px; height: 28px; background: #f44; animation: spin 1s linear infinite, hue 2s linear infinite; }
    body.native #anim-body { display: block; position: absolute; top: 48px; left: 0; right: 0; bottom: 0; overflow: hidden; background: #804; animation: hue 1.5s linear infinite; }
    body.native #anim-body::before { content: ""; position: absolute; left: 20%; top: 20%; width: 60%; height: 60%; background: #fd0; animation: spin 2s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes hue { to { filter: hue-rotate(360deg); } }
  </style>
</head>
<body>
  <header>Peekaboo Spike - 미리보기 창</header>
  <div id="anim-header"></div>
  <div id="anim-body"></div>
  <main>
    <p>프레임 없는 항상-위 창의 show/hide 포커스 시험용 화면입니다.</p>
    <p>이 창이 보이는 동안 다른 앱의 포커스가 유지되어야 합니다.</p>
    <p>The quick brown fox jumps over the lazy dog.</p>
    <select>
      <option>옵션 1</option>
      <option>옵션 2</option>
      <option>옵션 3</option>
    </select>
    <button type="button">버튼</button>
  </main>
  <script src="native.js"></script>
</body>
</html>
